services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - target: 27017
        published: "27017"
        protocol: tcp
        mode: host
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\"" ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ahadu_center
      CLIENT_ORIGIN: http://localhost:3000,http://localhost,http://127.0.0.1:3000,http://127.0.0.1
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api
        # Override VITE_GOOGLE_CLIENT_ID in the shell for another Google OAuth client.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-595155246581-s0j0b0fikrv6agl17g61q43k2qhh79mi.apps.googleusercontent.com}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongo_data:
