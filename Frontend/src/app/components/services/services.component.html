<section class="services">
  <div class="container">
    <div class="service-grid">
      <div
        class="service-card"
        *ngFor="let service of services"
        [ngClass]="service.id"
      >
        <img
          [src]="service.image"
          [alt]="service.title"
          class="service-img"
          [ngClass]="service.imageClass"
        />
        <h3 class="service-title">{{ service.title }}</h3>
        <p>{{ service.description }}</p>
        <button class="btn-primary">{{ service.buttonText }}</button>
      </div>
    </div>
  </div>
</section>
