<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-section">
        <img src="/images/logo.png" alt="Ahadu Center" class="footer-img" />
      </div>
      <div class="footer-section">
        <h3>Contact Info</h3>
        <p>
          {{ contactInfo.address }}
          <br />
          {{ contactInfo.city }}
        </p>
        <p>
          Phone: {{ contactInfo.phone }}
          <br />
          Email: {{ contactInfo.email }}
        </p>
      </div>
      <div class="footer-section">
        <h3>Hours</h3>
        <p>
          <span *ngFor="let hour of hours; let last = last">
            {{ hour.days }}: {{ hour.hours }}
            <br *ngIf="!last" />
          </span>
        </p>
      </div>

      <div class="footer-section">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a
            *ngFor="let social of socialMedia"
            [href]="social.url"
            class="social-icon"
          >
            <i [class]="social.icon"></i>
          </a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Ahadu Center. All rights reserved.</p>
    </div>
  </div>
</footer>
